<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Products</h1>
        <a class="btn btn-primary" th:href="@{/products/new}">Add Product</a>
    </div>

    <form class="card card-body mb-3" th:action="@{/products}" method="get">
        <div class="row g-2 align-items-end">
            <div class="col-md-5">
                <label for="name" class="form-label">Search by name</label>
                <input id="name" name="name" class="form-control" th:value="${name}">
            </div>
            <div class="col-md-4">
                <label for="categoryId" class="form-label">Category</label>
                <select id="categoryId" name="categoryId" class="form-select">
                    <option value="">All categories</option>
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}" th:selected="${category.id == categoryId}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-outline-primary flex-fill" type="submit">Search</button>
                <a class="btn btn-outline-secondary" th:href="@{/products}">Clear</a>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td>
                        <img th:if="${product.hasImage()}" class="product-thumb" th:src="@{/products/{id}/image(id=${product.id})}" th:alt="${product.name}">
                        <div th:unless="${product.hasImage()}" class="empty-image">No image</div>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${product.name}">Product</div>
                        <div class="text-muted small" th:text="${product.description}">Description</div>
                    </td>
                    <td th:text="${product.category.name}">Category</td>
                    <td th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</td>
                    <td>
                        <span class="badge" th:classappend="${product.active} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${product.active} ? 'Active' : 'Inactive'">Active</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a>
                        <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" class="d-inline">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="text-center text-muted py-4">No products found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
