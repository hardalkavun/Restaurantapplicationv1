<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <h1 class="h3 mb-3" th:text="${pageTitle}">Product</h1>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="card">
        <div class="card-body">
            <form th:action="${productForm.id == null} ? @{/products} : @{/products/{id}(id=${productForm.id})}" th:object="${productForm}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="price" class="form-label">Price</label>
                        <input id="price" th:field="*{price}" type="number" min="0.01" step="0.01" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>
                    <div class="col-md-3">
                        <label for="categoryId" class="form-label">Category</label>
                        <select id="categoryId" th:field="*{categoryId}" class="form-select" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
                            <option value="">Select category</option>
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                    </div>
                    <div class="col-12">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="col-md-8">
                        <label for="imageFile" class="form-label">Product image</label>
                        <input id="imageFile" th:field="*{imageFile}" type="file" accept="image/*" class="form-control">
                        <div class="form-text">Uploaded image bytes are saved in the MySQL BLOB column.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label d-block">Active status</label>
                        <div class="form-check form-switch">
                            <input id="active" th:field="*{active}" class="form-check-input" type="checkbox">
                            <label for="active" class="form-check-label">Available on menu</label>
                        </div>
                    </div>
                    <div class="col-12" th:if="${product != null and product.hasImage()}">
                        <div class="text-muted small mb-2">Current image</div>
                        <img class="product-thumb" th:src="@{/products/{id}/image(id=${product.id})}" th:alt="${product.name}">
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
