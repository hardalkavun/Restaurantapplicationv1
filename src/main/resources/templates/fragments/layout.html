<!doctype html>
<!-- Ortak Thymeleaf fragment: head, navbar, footer; diğer sayfalar th:replace ile kullanır. -->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Restoran Yönetimi'">Restoran Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="food-background">
<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container-fluid page-shell">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Restoran</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" th:if="${navUsername == null}">
                    <a class="nav-link"
                       th:href="@{/menu}"
                       th:classappend="${currentPath.startsWith('/menu')} ? ' active' : ''">
                        <i class="bi bi-shop me-1"></i>Menü
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsManager}">
                    <a class="nav-link"
                       th:href="@{/dashboard}"
                       th:classappend="${currentPath.startsWith('/dashboard')} ? ' active' : ''">
                        Panel
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsManager}">
                    <a class="nav-link"
                       th:href="@{/products}"
                       th:classappend="${currentPath.startsWith('/products')} ? ' active' : ''">
                        Ürünler
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsManager}">
                    <a class="nav-link"
                       th:href="@{/categories}"
                       th:classappend="${currentPath.startsWith('/categories')} ? ' active' : ''">
                        Kategoriler
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsManager}">
                    <a class="nav-link"
                       th:href="@{/orders}"
                       th:classappend="${currentPath.startsWith('/orders')} ? ' active' : ''">
                        Siparişler
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsCourier}">
                    <a class="nav-link"
                       th:href="@{/courier/orders}"
                       th:classappend="${currentPath.startsWith('/courier')} ? ' active' : ''">
                        Teslimatlarım
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsCustomer}">
                    <a class="nav-link"
                       th:href="@{/customer/menu}"
                       th:classappend="${currentPath.startsWith('/customer/menu')} ? ' active' : ''">
                        Menü
                    </a>
                </li>
                <li class="nav-item" th:if="${navIsCustomer}">
                    <a class="nav-link"
                       th:href="@{/customer/orders}"
                       th:classappend="${currentPath.startsWith('/customer/orders')} ? ' active' : ''">
                        Siparişlerim
                    </a>
                </li>
            </ul>
            <span class="navbar-text me-3" th:if="${navUsername != null}" th:text="${navUsername}">user</span>
            <a class="btn btn-outline-primary btn-sm" th:if="${navUsername == null}" th:href="@{/login}">
                <i class="bi bi-box-arrow-in-right me-1"></i>Giriş
            </a>
            <form th:if="${navUsername != null}" th:action="@{/logout}" method="post" class="d-flex">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Çıkış</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="mb-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
