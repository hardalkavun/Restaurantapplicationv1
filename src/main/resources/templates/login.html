<!doctype html>
<!-- Giriş sayfası: /login GET; form POST Spring Security /login işler. -->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giriş')}"></head>
<body class="food-background">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3 text-center">Restoran Girişi</h1>
                    <div th:replace="~{fragments/layout :: alerts}"></div>
                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı adı</label>
                            <input name="username" class="form-control" autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Şifre</label>
                            <input name="password" type="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
