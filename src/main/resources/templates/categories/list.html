<!doctype html>
<!-- Kategori listesi: CategoryController GET /categories. -->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kategoriler')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="page-hero mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h1 class="h3 mb-1">Kategoriler</h1>
                <div class="subtitle small">Ürünleri menüde düzenli göstermek için kategorileri yönetin.</div>
            </div>
            <a class="btn btn-primary" th:href="@{/categories/new}">
                <i class="bi bi-plus-circle me-1"></i>Kategori Ekle
            </a>
        </div>
    </section>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4" th:each="category : ${categories}">
            <div class="card product-card h-100">
                <div class="card-body d-flex align-items-start justify-content-between gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="stat-icon" style="width:38px;height:38px;border-radius:14px;">
                            <i class="bi bi-tag"></i>
                        </span>
                        <div>
                            <div class="fw-semibold" th:text="${category.name}">Kategori</div>
                            <div class="small text-muted">Kategori No: <span th:text="${category.id}">1</span></div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/categories/{id}/edit(id=${category.id})}">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12" th:if="${#lists.isEmpty(categories)}">
            <div class="alert alert-light border mb-0">Kategori bulunamadı.</div>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
