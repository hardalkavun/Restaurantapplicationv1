<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sipariş Detayı')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <section class="page-hero mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h1 class="h3 mb-1" th:text="'Sipariş #' + ${order.id}">Sipariş</h1>
                <div class="subtitle small">
                    Durum: <span class="badge badge-soft" th:text="${order.status.displayName}">Durum</span>
                </div>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/customer/orders}">
                <i class="bi bi-arrow-left me-1"></i>Geri
            </a>
        </div>
    </section>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Teslimat</h2>
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Ad soyad</dt><dd class="col-sm-8" th:text="${order.customerName}">Ad</dd>
                        <dt class="col-sm-4">Telefon</dt><dd class="col-sm-8" th:text="${order.customerPhone}">Telefon</dd>
                        <dt class="col-sm-4">Adres</dt><dd class="col-sm-8" th:text="${order.address}">Adres</dd>
                        <dt class="col-sm-4">Tarih</dt><dd class="col-sm-8" th:text="${#temporals.format(order.orderDateTime, 'dd.MM.yyyy HH:mm')}">Tarih</dd>
                        <dt class="col-sm-4">Toplam</dt><dd class="col-sm-8 fw-semibold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)} + ' ₺'">0 ₺</dd>
                        <dt class="col-sm-4">Kurye</dt><dd class="col-sm-8" th:text="${order.assignedCourier != null ? order.assignedCourier.username : 'Henüz atanmadı'}">Kurye</dd>
                        <dt class="col-sm-4">Not</dt><dd class="col-sm-8" th:text="${order.notes != null ? order.notes : '-'}">Not</dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Ürünler</h2>
                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 d-flex align-items-center gap-3" th:each="product : ${order.products}">
                            <img th:if="${product.hasImage()}" class="detail-image rounded-3" th:src="@{/products/{id}/image(id=${product.id})}" th:alt="${product.name}">
                            <div th:unless="${product.hasImage()}" class="detail-image-placeholder rounded-3 d-flex align-items-center justify-content-center text-muted small flex-shrink-0 border">
                                Görsel yok
                            </div>
                            <div>
                                <div class="fw-semibold" th:text="${product.name}">Ürün</div>
                                <div class="text-muted small" th:text="${product.category.name}">Kategori</div>
                                <div th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' ₺'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
