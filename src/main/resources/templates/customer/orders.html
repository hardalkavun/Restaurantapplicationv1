<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Siparişlerim')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="page-hero mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h1 class="h3 mb-1">Siparişlerim</h1>
                <div class="subtitle small">Sipariş durumlarınızı buradan takip edebilirsiniz.</div>
            </div>
            <a class="btn btn-primary" th:href="@{/customer/menu}">
                <i class="bi bi-bag-plus me-1"></i>Yeni Sipariş
            </a>
        </div>
    </section>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-light border">Henüz siparişiniz yok.</div>
    <div class="row g-3" th:if="${!#lists.isEmpty(orders)}">
        <div class="col-md-6" th:each="order : ${orders}">
            <a class="card product-card h-100 text-decoration-none text-reset" th:href="@{/customer/orders/{id}(id=${order.id})}">
                <div class="card-body">
                    <div class="d-flex align-items-start justify-content-between gap-2">
                        <div>
                            <div class="fw-semibold" th:text="'Sipariş #' + ${order.id}">Sipariş</div>
                            <div class="small text-muted" th:text="${#temporals.format(order.orderDateTime, 'dd.MM.yyyy HH:mm')}">Tarih</div>
                        </div>
                        <span class="badge badge-soft" th:text="${order.status.displayName}">Durum</span>
                    </div>
                    <div class="mt-3 small text-muted" th:text="${order.address}">Adres</div>
                    <div class="mt-2 small">
                        <span th:text="${#lists.size(order.products)}">0</span> ürün
                    </div>
                    <div class="mt-2 fw-semibold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)} + ' ₺'">0 ₺</div>
                </div>
            </a>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
