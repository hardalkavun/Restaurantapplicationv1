<!doctype html>
<!-- Yönetici paneli: DashboardController /dashboard; ürün/kategori/sipariş sayıları. -->
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel')}"></head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>
<main class="container page-shell py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <section class="page-hero mb-4">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div>
                <h1 class="h3 mb-1">Yönetim Paneli</h1>
                <div class="subtitle small">Ürünler, kategoriler ve aktif teslimatlar.</div>
            </div>
            <a class="btn btn-primary" th:href="@{/orders/new}">
                <i class="bi bi-bag-plus me-1"></i>Yeni Sipariş
            </a>
        </div>
    </section>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="stat-card h-100">
                <div class="card-body text-center py-4">
                    <div class="stat-icon mb-2"><i class="bi bi-grid-3x3-gap"></i></div>
                    <div class="text-muted small">Ürünler</div>
                    <div class="display-5 fw-bold mb-0" th:text="${productCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card h-100">
                <div class="card-body text-center py-4">
                    <div class="stat-icon mb-2"><i class="bi bi-tags"></i></div>
                    <div class="text-muted small">Kategoriler</div>
                    <div class="display-5 fw-bold mb-0" th:text="${categoryCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card h-100">
                <div class="card-body text-center py-4">
                    <div class="stat-icon mb-2"><i class="bi bi-receipt"></i></div>
                    <div class="text-muted small">Siparişler</div>
                    <div class="display-5 fw-bold mb-0" th:text="${orderCount}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card h-100">
                <div class="card-body text-center py-4">
                    <div class="stat-icon mb-2"><i class="bi bi-truck"></i></div>
                    <div class="text-muted small">Aktif Teslimatlar</div>
                    <div class="display-5 fw-bold mb-0" th:text="${preparingCount + onTheWayCount}">0</div>
                </div>
            </div>
        </div>
    </div>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
