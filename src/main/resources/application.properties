# Uygulama adı (log ve yönetim amaçlı)
spring.application.name=restaurant-management

# MySQL bağlantısı: veritabanı yoksa oluştur; SSL kapalı (yerel geliştirme); saat dilimi UTC
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: şemayı entity'lere göre güncelle; konsolda formatlı SQL göster
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ürün görseli yükleme üst sınırı
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Oturum zaman aşımı
server.servlet.session.timeout=30m
# HTTP portu
server.port=9091
#server.error.whitelabel.enabled=false
